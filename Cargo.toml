[workspace]
members = [
    "crates/app",
    "crates/core",
    "crates/providers",
    "crates/opencode",
    "crates/governor",
    "crates/slop",
    "crates/telegram",
    "crates/skills",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
